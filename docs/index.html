<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Base de Conhecimento | FSGRJ</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <!-- Tema Escuro Nativo do Docsify -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/dark.css">
  
  <style>
    /* Ajustes visuais para aproximar do tema escuro do Azure DevOps */
    :root {
      --base-background-color: #1e1e1e;
      --sidebar-background: #252526;
      --theme-color: #4ea1f3;
    }
    body {
      background-color: #1e1e1e;
      color: #d4d4d4;
    }
    .sidebar {
      background-color: #252526;
      border-right: 1px solid #333333;
    }
    .sidebar ul li a {
      color: #cccccc;
      font-size: 14px;
    }
    .sidebar ul li.active > a {
      color: #4ea1f3;
      font-weight: 600;
    }
    .markdown-section code {
      background-color: #2d2d2d;
      color: #ce9178;
    }
  </style>
</head>
<body>
  <div id="app">Carregando documentação...</div>

  <script>
    window.$docsify = {
      name: 'Documentação Técnica',
      repo: 'https://github.com',
      loadSidebar: true,
      subMaxLevel: 2,
      auto2top: true,
      
      // Configuração da barra de busca em Português
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Pesquisar na documentação...',
        noData: 'Nenhum resultado encontrado.',
        depth: 3
      }
    }
  </script>

  <!-- Core do Docsify -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  
  <!-- Plugins: Busca e Botão de Copiar Código -->
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
</body>
</html>
